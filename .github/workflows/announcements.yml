name: Refresh announcements

# The Canvas feed can't be read from the browser: it sends no CORS headers,
# and its URL is an enrollment-scoped secret that must stay out of the repo.
# So the fetch happens here instead, and only the resulting posts are
# committed.

on:
  schedule:
    # Twice a day, offset off the hour so it isn't competing for runners.
    - cron: '17 7,19 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-announcements
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the feed
        env:
          CANVAS_FEED_URL: ${{ secrets.CANVAS_FEED_URL }}
        run: |
          if [ -z "$CANVAS_FEED_URL" ]; then
            echo "::error::CANVAS_FEED_URL secret is not set. Add it under" \
                 "Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          python3 scripts/fetch_announcements.py

      - name: Commit if the announcements changed
        run: |
          if git diff --quiet -- announcements.js; then
            echo "No new announcements."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add announcements.js
          git commit -m "Update announcements from Canvas feed"
          git push
