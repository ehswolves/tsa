name: Refresh announcements

# The Canvas feed can't be read from the browser: it sends no CORS headers,
# so a fetch from the published site is blocked no matter where the URL
# lives. The fetch therefore happens here, and the resulting posts are
# committed for the site to load.

on:
  schedule:
    # Twice a day, offset off the hour so it isn't competing for runners.
    - cron: '17 7,19 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-announcements
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the feed
        run: python3 scripts/fetch_announcements.py

      - name: Commit if the announcements changed
        run: |
          if git diff --quiet -- announcements.js; then
            echo "No new announcements."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add announcements.js
          git commit -m "Update announcements from Canvas feed"
          git push
